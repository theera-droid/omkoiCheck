name: Update Omkoi and deploy standalone site
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '3-58/5 * * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        id: pages
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm test
      - name: Prepare availability data
        run: node scripts/export-pages.js
        env:
          PAGES_PREVIOUS_URL: ${{ steps.pages.outputs.base_url }}/data/availability.json
      - name: Build Vue for the configured Pages URL
        run: npm run build
        env:
          VITE_PAGES: 'true'
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deployment
